<style>
  :root {
    --hera-navy: #002B66;
    --hera-navy-deep: #001A40;
    --hera-blue: #0055B8;
    --hera-purple: #6A1B7B;
    --hera-orange: #E65100;
    --hera-green: #2E7D32;
    --hera-pink: #D81B60;
    --hera-blush: #FBF5F8;
    --hera-paper: #FFFFFF;
    --hera-ink: #1C2530;
    --hera-ink-soft: #514F63;
    --hera-bg-light: #F4F6F9;
    --shadow: 0 12px 30px -10px rgba(0, 43, 102, 0.15);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--hera-ink);
    background: var(--hera-paper);
    line-height: 1.6;
  }

  h1, h2, h3, h4 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    color: var(--hera-navy);
    margin: 0 0 12px 0;
  }
  p { margin: 0 0 16px 0; color: var(--hera-ink-soft); }
  a { color: inherit; text-decoration: none; }
  ul { margin: 0; padding: 0; list-style: none; }
  
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--hera-purple);
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
  }

  .container { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
  .section { padding: 80px 0; }
  .bg-light { background-color: var(--hera-bg-light); }
  .bg-blush { background-color: var(--hera-blush); }
  .bg-navy { background-color: var(--hera-navy); color: #fff; }
  .bg-navy h2, .bg-navy h3 { color: #fff; }
  .bg-navy p { color: rgba(255,255,255,0.8); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 999px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all .25s ease;
  }
  .btn-primary { background: var(--hera-blue); color: #fff; }
  .btn-primary:hover { background: var(--hera-navy); transform: translateY(-2px); }
  .btn-donate { background: var(--hera-orange); color: #fff; box-shadow: 0 10px 20px -8px rgba(230,81,0,0.5); }
  .btn-donate:hover { background: #c64400; transform: translateY(-2px); }
  .btn-whatsapp { background: var(--hera-green); color: #fff; box-shadow: 0 10px 20px -8px rgba(46,125,50,0.4); }
  .btn-whatsapp:hover { background: #1b5e20; transform: translateY(-2px); }
  .btn-outline { border-color: var(--hera-navy); color: var(--hera-navy); background: #fff; }
  .btn-outline:hover { background: var(--hera-navy); color: #fff; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0, 43, 102, 0.08);
  }
  .nav-wrap {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { height: 52px; width: 52px; object-fit: cover; border-radius: 50%; }
  .brand-text { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.3rem; color: var(--hera-navy); }
  nav.links { display: flex; gap: 20px; align-items: center; }
  nav.links a { font-size: 0.92rem; font-weight: 600; white-space: nowrap; }
  nav.links a.nav-blue { color: var(--hera-blue); }
  nav.links a.nav-orange { color: var(--hera-orange); }

  .social-nav-wrap {
    display: flex; align-items: center; gap: 8px; margin-left: 8px; padding-left: 12px;
    border-left: 2px solid rgba(0, 43, 102, 0.1);
  }
  .social-icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%; background: var(--hera-bg-light); color: var(--hera-navy);
  }
  .social-icon-btn:hover { background: var(--hera-blue); color: #fff; }
  .social-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* HERO ZOOM MOTION */
  .hero { position: relative; overflow: hidden; padding: 80px 0 90px; background: var(--hera-paper); }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center; }
  .hero h1 { font-size: clamp(2.2rem, 4vw, 3.5rem); font-weight: 800; }
  .hero h1 em { font-style: normal; color: var(--hera-blue); }
  .hero-cta { display: flex; gap: 16px; margin-top: 28px; flex-wrap: wrap; }

  .hero-motion-frame {
    position: relative; width: 100%; height: 440px; border-radius: 28px; overflow: hidden;
    box-shadow: 0 20px 40px -15px rgba(0, 43, 102, 0.25); border: 4px solid #fff;
  }
  .hero-slide-item {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0;
    animation: heroZoomFade 20s infinite ease-in-out;
  }
  .hero-slide-item img { width: 100%; height: 100%; object-fit: cover; }
  .hero-slide-item:nth-child(1) { animation-delay: 0s; }
  .hero-slide-item:nth-child(2) { animation-delay: 4s; }
  .hero-slide-item:nth-child(3) { animation-delay: 8s; }
  .hero-slide-item:nth-child(4) { animation-delay: 12s; }
  .hero-slide-item:nth-child(5) { animation-delay: 16s; }

  @keyframes heroZoomFade {
    0% { opacity: 0; transform: scale(1); }
    5% { opacity: 1; }
    20% { opacity: 1; }
    25% { opacity: 0; transform: scale(1.12); }
    100% { opacity: 0; transform: scale(1); }
  }

  .sec-head { max-width: 680px; margin-bottom: 48px; }
  .sec-head h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); }
  .center { text-align: center; margin-left: auto; margin-right: auto; }

  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
  .mv-card {
    background: var(--hera-navy); color: #fff; border-radius: 20px; padding: 32px;
  }
  .mv-card h3 { color: #fff; }
  .mv-card p { color: rgba(255, 255, 255, 0.95) !important; }

  .thematic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
  .thematic-card {
    background: #fff; border-radius: 16px; padding: 32px;
    border: 1px solid rgba(0, 43, 102, 0.08); box-shadow: var(--shadow);
  }
  .thematic-card.border-health { border-top: 5px solid var(--hera-blue); }
  .thematic-card.border-equity { border-top: 5px solid var(--hera-navy); }
  .thematic-card.border-rights { border-top: 5px solid var(--hera-purple); }
  .thematic-card.border-advocacy { border-top: 5px solid var(--hera-orange); }
  .thematic-card.border-climate { border-top: 5px solid var(--hera-green); }

  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .card-simple { background: #fff; padding: 28px; border-radius: 16px; border: 1px solid rgba(0, 43, 102, 0.06); }
  .mama-care-card { background: linear-gradient(135deg, #fff 0%, var(--hera-blush) 100%); border: 2px solid var(--hera-pink); }

  .slider-container { overflow: hidden; width: 100%; position: relative; padding: 20px 0; }
  .slider-track { display: flex; gap: 24px; width: calc(340px * 28); animation: autoSlide 65s linear infinite; }
  .slider-track:hover { animation-play-state: paused; }
  @keyframes autoSlide {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(-344px * 14)); }
  }
  .gallery-item {
    width: 320px; flex-shrink: 0; background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); border: 1px solid rgba(0, 43, 102, 0.08);
  }
  .gallery-img-wrap { width: 100%; height: 230px; overflow: hidden; }
  .gallery-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .gallery-caption { padding: 16px 20px; font-size: 0.9rem; color: var(--hera-navy); }

  .mama-banner {
    background: var(--hera-purple); color: #ffffff; border-radius: 24px; padding: 40px;
    display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 32px; align-items: center;
  }
  .mama-banner h2, .mama-banner p { color: #ffffff !important; }

  .approach-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .step-box { background: #fff; border-radius: 12px; padding: 20px; text-align: center; border-top: 4px solid var(--hera-blue); }

  .impact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
  .impact-stat { background: #fff; padding: 28px; border-radius: 16px; text-align: center; box-shadow: var(--shadow); }
  .impact-stat .number { font-size: 2.5rem; font-weight: 800; color: var(--hera-blue); }

  .donate-box { background: var(--hera-blush); border: 2px solid var(--hera-pink); border-radius: 20px; padding: 36px; text-align: center; max-width: 600px; margin: 0 auto; }
  .paybill-info { background: #fff; padding: 16px 24px; border-radius: 12px; display: inline-block; margin: 16px 0; font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--hera-navy); }

  <footer>
  <div class="container footer-row">
    <div>
      <strong style="color:#fff; font-family:'Poppins', serif; font-size: 1.1rem;">HERA Initiative</strong>
      <p class="footer-text">Advancing health, equity, rights and climate justice through community action in Kilifi, Kenya.</p>
    </div>
    <div class="footer-text">
      © 2026 HERA Initiative. All Rights Reserved.
    </div>
  </div>
  </footer>

</body>
</html>
